<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>One More Step</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: #0B0D1A;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }
    #game-wrapper {
      background: #0B0D1A;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px #2a2a5a inset;
      max-width: 450px;
      width: 100%;
      margin: 6px;
      position: relative;
      aspect-ratio: 9 / 12;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: #0B0D1A;
      box-shadow: 0 0 40px #00f0ff33;
      touch-action: none;
      cursor: pointer;
      border: 2px solid #00f0ff55;
      aspect-ratio: 9 / 12;
    }
    #ui-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 3px;
      color: #00E5FF;
      font-weight: 600;
      text-shadow: 0 0 10px #00E5FF55;
      z-index: 5;
      pointer-events: none;
    }
    #ui-overlay div {
      background: rgba(11, 13, 26, 0.7);
      padding: 2px 8px;
      border-radius: 30px;
      border: 1px solid #00E5FF55;
      backdrop-filter: blur(4px);
      font-size: 0.6rem;
      display: flex;
      align-items: center;
      gap: 3px;
      pointer-events: auto;
    }
    #ui-overlay button {
      background: rgba(11, 13, 26, 0.7);
      border: 1px solid #00E5FF55;
      color: #00E5FF;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 30px;
      font-size: 0.6rem;
      box-shadow: 0 0 20px #00E5FF33;
      transition: 0.1s;
      touch-action: manipulation;
      cursor: pointer;
      pointer-events: auto;
    }
    #ui-overlay button:active { transform: scale(0.94); background: #00E5FF22; }
    @media (max-width: 500px) {
      .developer-podium { padding: 8px 12px 8px 8px; gap: 9px; margin-bottom: 14px; }
      .developer-podium img { width: 56px; height: 56px; }
      .developer-label { font-size: 7px; letter-spacing: 2px; }
    }
    @media (max-width: 500px) {
      #ui-overlay div { font-size: 0.5rem; padding: 2px 5px; }
      #ui-overlay button { font-size: 0.5rem; padding: 2px 5px; }
      #game-wrapper { padding: 5px; border-radius: 16px; }
      #ui-overlay { top: 8px; left: 8px; right: 8px; }
    }
    @media (max-width: 380px) {
      #ui-overlay div { font-size: 0.4rem; padding: 1px 4px; }
      #ui-overlay button { font-size: 0.4rem; padding: 1px 4px; }
    }

    #startMenu {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: rgba(11, 13, 26, 0.92);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.15);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .developer-podium {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 12px 18px;
      padding: 10px 16px 10px 10px;
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 18px;
      background: rgba(0, 229, 255, 0.055);
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.10), inset 0 0 18px rgba(255,255,255,0.025);
      backdrop-filter: blur(8px);
    }
    .developer-podium img {
      width: 68px;
      height: 68px;
      object-fit: cover;
      object-position: center top;
      border-radius: 50%;
      border: 2px solid #00E5FF;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.35);
      flex-shrink: 0;
    }
    .developer-info {
      text-align: left;
    }
    .developer-label {
      color: rgba(180, 220, 255, 0.58);
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .developer-name {
      color: #ffffff;
      font-size: clamp(14px, 3.8vw, 19px);
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.32);
    }

    /* ================= DEVELOPER INTRO ANIMATION ================= */
    #developerIntro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(0,229,255,.12), transparent 28%),
        radial-gradient(circle at 20% 80%, rgba(168,85,247,.10), transparent 30%),
        #020611;
      animation: none;
      pointer-events: none;
    }
    #developerIntro.fade-out {
      animation: introFadeOut .9s ease forwards;
      pointer-events: none;
    }

    #developerIntro::before, #developerIntro::after {
      content: '';
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border: 1px solid rgba(0,229,255,.13);
      border-radius: 50%;
      animation: introOrbit 4s linear infinite;
    }
    #developerIntro::after {
      width: 45vmax;
      height: 45vmax;
      border-color: rgba(214,70,255,.15);
      animation-direction: reverse;
      animation-duration: 3s;
    }
    .intro-content {
      position: relative;
      z-index: 2;
      text-align: center;
      transform: translateY(0) scale(1);
      opacity: 1;
      animation: none;
    }
    .intro-photo-wrap {
      position: relative;
      width: min(42vw, 210px);
      height: min(42vw, 210px);
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 5px;
      background: conic-gradient(from 0deg, #00e5ff, #8b5cf6, #ff3df2, #00e5ff);
      box-shadow: 0 0 28px rgba(0,229,255,.45), 0 0 70px rgba(139,92,246,.22);
      animation: introPhotoPulse 2s ease-in-out infinite;
    }
    .intro-photo-wrap::before {
      content: '';
      position: absolute;
      inset: -13px;
      border: 1px solid rgba(0,229,255,.42);
      border-radius: 50%;
      border-top-color: #00e5ff;
      border-right-color: transparent;
      animation: introSpin 2.8s linear infinite;
    }
    .intro-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
      border-radius: 50%;
      border: 4px solid #030712;
      box-sizing: border-box;
    }
    .intro-small {
      color: rgba(180,220,255,.72);
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 9px;
      animation: introTextGlow 1.7s ease-in-out infinite;
    }
    .intro-name {
      color: #fff;
      font-size: clamp(25px, 7vw, 42px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0,229,255,.75), 0 0 35px rgba(139,92,246,.35);
      margin-bottom: 12px;
    }
    .intro-line {
      width: 150px;
      height: 2px;
      margin: 0 auto;
      background: linear-gradient(90deg, transparent, #00e5ff, #d946ef, #00e5ff, transparent);
      box-shadow: 0 0 12px #00e5ff;
      animation: introLine 1.2s ease-out .7s both;
    }
    .intro-skip {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(180,220,255,.45);
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    @keyframes introContentIn {
      from { opacity: 0; transform: translateY(18px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes introPhotoPulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }
    @keyframes introSpin { to { transform: rotate(360deg); } }
    @keyframes introOrbit { to { transform: rotate(360deg); } }
    @keyframes introTextGlow {
      0%,100% { opacity: .65; }
      50% { opacity: 1; }
    }
    @keyframes introLine {
      from { width: 0; opacity: 0; }
      to { width: 150px; opacity: 1; }
    }
    @keyframes introFadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    #startMenu.intro-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }
    #startMenu.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }
    #startMenu .title {
      font-size: clamp(26px, 6.5vw, 40px);
      font-weight: 900;
      background: linear-gradient(135deg, #00E5FF, #7a5ae8, #00E5FF);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 3s ease-in-out infinite;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-align: center;
      padding: 0 10px;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    #startMenu .subtitle {
      color: rgba(180, 170, 220, 0.5);
      font-size: clamp(9px, 1.8vw, 13px);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    #startMenu .start-btn {
      padding: 12px 36px;
      font-size: clamp(14px, 2.8vw, 20px);
      font-weight: 800;
      color: #0B0D1A;
      background: linear-gradient(135deg, #00E5FF, #7a5ae8);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.2);
      letter-spacing: 2px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #startMenu .start-btn:active { transform: scale(0.95); }
    #startMenu .controls-hint {
      color: rgba(180, 170, 220, 0.3);
      font-size: clamp(7px, 1.2vw, 11px);
      margin-top: 12px;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.6;
      padding: 0 10px;
    }
    #startMenu .controls-hint span { color: rgba(0, 229, 255, 0.5); }

    /* Touch anywhere indicator */
    #touchHint {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(0, 229, 255, 0.2);
      font-size: clamp(9px, 1.8vw, 13px);
      letter-spacing: 2px;
      text-align: center;
      pointer-events: none;
      z-index: 5;
      opacity: 0.6;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.05);
      animation: pulseHint 2s ease-in-out infinite;
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.8; transform: translateX(-50%) scale(1.05); }
    }
    @media (max-width: 500px) {
      #touchHint { bottom: 14%; font-size: 9px; }
    }
  
/* Developer credit visibility: photo -> Developer -> AKSHAYADHARSHINI */
.intro-developed{display:block!important;visibility:visible!important;opacity:1!important;}
.intro-name{display:block!important;visibility:visible!important;opacity:1!important;}
</style>
</head>

<script>
  (function() {
    // ============================================================
    // CANVAS SETUP - 9:12 Aspect Ratio
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    // Canvas is 450x600 (9:12)
    const W = 450, H = 600;

    const scoreSpan = document.getElementById('scoreDisplay');
    const coinSpan = document.getElementById('coinDisplay');
    const timeSpan = document.getElementById('timeDisplay');
    const bestSpan = document.getElementById('bestDisplay');
    const startMenu = document.getElementById('startMenu');
    const startBtn = document.getElementById('startBtn');
    const soundBtn = document.getElementById('soundBtn');

    // ============================================================
    // SOUND ENGINE - LOUDER
    // ============================================================
    let audioCtx = null;
    let soundEnabled = true;
    let musicInterval = null;
    let musicPlaying = false;
    let musicActive = false;

    function initAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) { /* ignore */ }
      }
    }

    function playTone(freq, duration, type = 'sine', volume = 0.25) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) { /* ignore */ }
    }

    function playBackgroundMusic() {
      if (!soundEnabled || !audioCtx || musicPlaying) return;
      musicPlaying = true;
      musicActive = true;
      const bpm = 145;
      const beatDuration = 60 / bpm;
      let beatCount = 0;
      if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
      function playBeat(beatNum) {
        if (!musicActive || !soundEnabled || !audioCtx) return;
        try {
          if (beatNum % 2 === 0) playTone(80, 0.15, 'sawtooth', 0.12);
          if (beatNum % 4 === 1 || beatNum % 4 === 3) playTone(200, 0.1, 'square', 0.08);
          if (beatNum % 1 === 0) playTone(8000, 0.025, 'square', 0.04);
          const bassNotes = [55, 55, 62, 62, 55, 55, 65, 65];
          const note = bassNotes[beatNum % bassNotes.length];
          if (beatNum % 2 === 0) playTone(note, 0.18, 'sawtooth', 0.08);
          const melodyNotes = [330, 392, 440, 523, 330, 392, 440, 523];
          const melNote = melodyNotes[beatNum % melodyNotes.length];
          if (beatNum % 4 === 0) playTone(melNote, 0.12, 'sine', 0.09);
          if (beatNum % 4 === 2) playTone(melNote * 1.25, 0.1, 'sine', 0.07);
          if (beatNum % 8 === 0 || beatNum % 8 === 4) playTone(600, 0.08, 'square', 0.06);
        } catch(e) { /* ignore */ }
      }
      musicInterval = setInterval(() => { playBeat(beatCount); beatCount++; }, beatDuration * 1000 / 2);
    }

    function stopBackgroundMusic() {
      musicActive = false; musicPlaying = false;
      if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
    }
    function pauseBackgroundMusic() { musicActive = false; }
    function resumeBackgroundMusic() {
      if (soundEnabled && audioCtx && !musicActive) {
        musicActive = true; musicPlaying = true;
        if (!musicInterval) playBackgroundMusic();
      }
    }

    function playJumpSound() {
      playTone(450, 0.18, 'square', 0.15);
      setTimeout(() => playTone(650, 0.12, 'square', 0.12), 80);
    }
    function playCoinSound() {
      playTone(880, 0.1, 'sine', 0.20);
      setTimeout(() => playTone(1100, 0.1, 'sine', 0.18), 80);
      setTimeout(() => playTone(1320, 0.15, 'sine', 0.16), 160);
    }
    function playPowerupSound() {
      playTone(500, 0.12, 'sine', 0.18);
      setTimeout(() => playTone(700, 0.12, 'sine', 0.18), 100);
      setTimeout(() => playTone(900, 0.18, 'sine', 0.20), 200);
      setTimeout(() => playTone(1100, 0.25, 'sine', 0.16), 300);
    }
    function playGameOverSound() {
      stopBackgroundMusic();
      playTone(400, 0.25, 'sawtooth', 0.18);
      setTimeout(() => playTone(300, 0.25, 'sawtooth', 0.15), 200);
      setTimeout(() => playTone(200, 0.35, 'sawtooth', 0.12), 400);
    }
    function playShieldHitSound() {
      playTone(600, 0.12, 'square', 0.15);
      setTimeout(() => playTone(400, 0.12, 'square', 0.12), 100);
    }

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) { initAudio(); if (gameState === 'playing') resumeBackgroundMusic(); }
      else stopBackgroundMusic();
    });

    // ============================================================
    // GAME STATE
    // ============================================================
    let gameState = 'menu';
    let score = 0, coins = 0, totalCoins = parseInt(localStorage.getItem('onemorestep_totalCoins')) || 0;
    let bestScore = parseInt(localStorage.getItem('onemorestep_best')) || 0;
    let survivalTime = 0, frame = 0, difficulty = 1, comboCount = 0, comboTimer = 0;
    let gameSpeed = 3.5;
    let bgOffset = 0;

    // Player - adjusted for 9:12
    const player = {
      x: 180, y: 450, w: 18, h: 18, vy: 0,
      jumpPower: -6.0, onGround: false,
      doubleJump: false, doubleJumpTimer: 0,
      shield: false, shieldTimer: 0,
      magnet: false, magnetTimer: 0,
      speedBoost: false, speedBoostTimer: 0,
      slowEnemy: false, slowEnemyTimer: 0,
    };

    let tiles = [], holes = [], coinsList = [], enemies = [], powerups = [];
    let particles = [], floatingTexts = [], bgParticles = [];
    let camera = { x: 0, y: 0 }, screenShake = 0;

    const keys = { s: false, down: false };
    let touchJump = false;
    // Player must keep tapping/clicking to stay alive.
    let lastTapTime = 0;
    let gameplayStartTime = 0;
    const TAP_TIMEOUT = 1000; // 1 second without a tap during gameplay = game over
    const TAP_START_GRACE = 1500; // 1.5 second grace period after PLAY/restart
    let enemySpawnTimer = 0, powerupSpawnTimer = 0, lastPowerupType = '';

    // ============================================================
    // UTILITY
    // ============================================================
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max+1)); }
    function rectCollide(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
             a.y < b.y + b.h && a.y + a.h > b.y;
    }
    function spawnParticles(x, y, color, count=10) {
      for (let i=0; i<count; i++) {
        particles.push({
          x, y,
          vx: rand(-3,3), vy: rand(-4,1),
          life: rand(20,50), color, size: rand(3,7)
        });
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    function generateInitialTiles() {
      for (let i = -5; i < 30; i++) {
        tiles.push({ x: i * 30, y: 510, w: 30, h: 15 });
      }
    }

    function initBgParticles() {
      bgParticles = [];
      for (let i = 0; i < 50; i++) {
        bgParticles.push({
          x: rand(0, W), y: rand(0, H),
          size: rand(0.5, 2), speed: rand(0.1, 0.5),
          alpha: rand(0.2, 0.8)
        });
      }
    }
    initBgParticles();

    function initGame() {
      // Give the player a short grace period after pressing PLAY/restarting.
      lastTapTime = performance.now() + TAP_START_GRACE;
      score = 0; coins = 0; survivalTime = 0; frame = 0; difficulty = 1;
      comboCount = 0; comboTimer = 0;
      tiles = []; holes = []; coinsList = []; enemies = []; powerups = [];
      particles = []; floatingTexts = [];
      player.x = 180; player.y = 450; player.vy = 0; player.onGround = false;
    // Start the tap timer fresh for every new game so PLAY never causes an instant Game Over.
    gameplayStartTime = performance.now();
    lastTapTime = gameplayStartTime;
      player.doubleJump = false; player.doubleJumpTimer = 0;
      player.shield = false; player.shieldTimer = 0;
      player.magnet = false; player.magnetTimer = 0;
      player.speedBoost = false; player.speedBoostTimer = 0;
      player.slowEnemy = false; player.slowEnemyTimer = 0;
      camera.x = 0; camera.y = 0;
      enemySpawnTimer = 0; powerupSpawnTimer = 0; lastPowerupType = '';
      // Start a fresh 1-second tap window whenever a new game begins.
      lastTapTime = performance.now();
      touchJump = false;
      screenShake = 0; gameSpeed = 3.5;
      generateInitialTiles();
      gameState = 'playing';
      bestSpan.textContent = bestScore;
      if (soundEnabled) { initAudio(); playBackgroundMusic(); }
    }

    // ============================================================
    // SPAWNING - Adjusted for 9:12
    // ============================================================
    function spawnCoins() {
      if (coinsList.length < 20 + difficulty * 3) {
        for (let i = 0; i < 2; i++) {
          let tile = tiles[randInt(0, tiles.length-1)];
          if (tile) {
            coinsList.push({
              x: tile.x + 7 + rand(0, 10),
              y: tile.y - 14 + rand(-5, 0),
              w: 12, h: 12, collected: false, bob: rand(0, Math.PI*2)
            });
          }
        }
      }
    }

    function spawnEnemy() {
      if (enemies.length < 5 + difficulty) {
        let type = ['chaser','runner','jumper','spinner'][randInt(0,3)];
        let side = Math.random() > 0.5 ? 1 : -1;
        let x = player.x + side * (160 + rand(30, 180));
        let y = 450 + rand(-30, 15);
        enemies.push({
          type, x, y, w: 15, h: 15,
          speed: (type==='runner'? 2.2 + difficulty*0.2 : type==='chaser'? 0.8 + difficulty*0.2 : 0.6 + difficulty*0.15),
          angle: 0, jumpTimer: 0, state: 0, hp: 1,
        });
      }
    }

    function spawnPowerup() {
      if (powerups.length < 3) {
        let types = ['speed','slow','magnet','shield'];
        let available = types.filter(t => t !== lastPowerupType);
        let type = available[randInt(0, available.length-1)];
        lastPowerupType = type;
        let tile = tiles[randInt(0, tiles.length-1)];
        if (tile) {
          powerups.push({ type, x: tile.x + 7, y: tile.y - 24, w: 15, h: 15 });
        }
      }
    }

    function applyPowerup(type) {
      switch(type) {
        case 'speed': player.speedBoost = true; player.speedBoostTimer = 600; break;
        case 'slow': player.slowEnemy = true; player.slowEnemyTimer = 600; break;
        case 'magnet': player.magnet = true; player.magnetTimer = 600; break;
        case 'shield': player.shield = true; player.shieldTimer = 600; break;
      }
    }

    function gameOver() {
      gameState = 'gameover';
      screenShake = 15;
      playGameOverSound();
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('onemorestep_best', bestScore);
      }
      localStorage.setItem('onemorestep_totalCoins', totalCoins);
      for (let i=0; i<30; i++) spawnParticles(player.x+9, player.y+9, '#FF3B3B', 15);
    }

    // ============================================================
    // UPDATE
    // ============================================================
    function update() {
      if (gameState !== 'playing') return;

      // The runner only stays alive while the player keeps tapping/clicking.
      // Give the player a short grace period after PLAY/restart, then require a tap at least once per second.
      const now = performance.now();
      if (now - gameplayStartTime > TAP_START_GRACE && now - lastTapTime > TAP_TIMEOUT) {
        gameOver();
        return;
      }
      frame++;
      survivalTime += 1/60;
      difficulty = 1 + survivalTime / 20;
      if (comboTimer > 0) comboTimer--;
      bgOffset += 0.5;

      let currentSpeed = gameSpeed + difficulty * 0.2;
      if (player.speedBoostTimer > 0) {
        currentSpeed = (gameSpeed + difficulty * 0.2) * 1.8;
        player.speedBoostTimer--;
        if (player.speedBoostTimer <= 0) player.speedBoost = false;
      }
      if (player.slowEnemyTimer > 0) {
        player.slowEnemyTimer--;
        if (player.slowEnemyTimer <= 0) player.slowEnemy = false;
      }

      player.x += currentSpeed;

      let jump = false;
      if (keys.w || keys.up || touchJump) jump = true;

      let down = false;
      if (keys.s || keys.down) down = true;

      if (jump && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
        if (player.doubleJumpTimer > 0) player.doubleJump = true;
        playJumpSound();
        spawnParticles(player.x+9, player.y+18, '#00E5FF', 8);
        touchJump = false;
      } else if (jump && player.doubleJump && player.doubleJumpTimer > 0) {
        player.vy = player.jumpPower * 0.9;
        player.doubleJump = false;
        playJumpSound();
        spawnParticles(player.x+9, player.y+18, '#00E5FF', 10);
        touchJump = false;
      }

      if (down) {
        player.vy += 0.8;
      } else {
        player.vy += 0.4;
      }
      if (player.vy > 8) player.vy = 8;
      player.y += player.vy;

      player.onGround = false;
      for (let tile of tiles) {
        if (rectCollide(player, tile)) {
          if (player.vy > 0) {
            player.y = tile.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (player.vy < 0) {
            player.y = tile.y + tile.h;
            player.vy = 0;
          }
        }
      }

      for (let hole of holes) {
        if (rectCollide(player, hole)) { gameOver(); return; }
      }

      if (player.y < 60) player.y = 60;
      if (player.y > H - 35) { gameOver(); return; }

      // Coins
      for (let c of coinsList) {
        if (!c.collected && rectCollide(player, c)) {
          c.collected = true;
          coins++; totalCoins++; comboCount++; comboTimer = 30;
          let bonus = Math.floor(comboCount / 5) * 5;
          score += 10 + bonus;
          playCoinSound();
          spawnParticles(c.x+6, c.y+6, '#FFD700', 12);
          floatingTexts.push({ x: c.x, y: c.y-8, text: '+'+ (10+bonus), life: 40, color: '#FFD700', size: 13 });
          if (comboCount > 5) {
            floatingTexts.push({ x: c.x-8, y: c.y-25, text: '🔥 x'+Math.floor(comboCount/5), life: 50, color: '#FFD700', size: 14 });
          }
        }
      }
      coinsList = coinsList.filter(c => !c.collected);

      if (player.magnetTimer > 0) {
        for (let c of coinsList) {
          let dx2 = player.x - c.x, dy2 = player.y - c.y;
          let dist = Math.hypot(dx2, dy2);
          if (dist < 100 && dist > 0) {
            c.x += dx2 / dist * 2.2;
            c.y += dy2 / dist * 2.2;
          }
        }
        player.magnetTimer--;
        if (player.magnetTimer <= 0) player.magnet = false;
      }

      for (let p of powerups) {
        if (rectCollide(player, p)) {
          applyPowerup(p.type);
          let color = p.type === 'speed' ? '#FF6600' :
                      p.type === 'slow' ? '#FFFFFF' :
                      p.type === 'magnet' ? '#9C27B0' : '#00C853';
          playPowerupSound();
          spawnParticles(p.x+7, p.y+7, color, 18);
          floatingTexts.push({ x: p.x - 20, y: p.y - 24, text: '⚡ ' + p.type.toUpperCase() + '!', life: 60, color, size: 22 });
          p.type = 'used';
        }
      }
      powerups = powerups.filter(p => p.type !== 'used');

      for (let e of enemies) {
        let enemySpeed = e.speed;
        if (player.slowEnemyTimer > 0) enemySpeed *= 0.3;

        if (e.type === 'chaser') {
          let dx2 = player.x - e.x, dy2 = player.y - e.y;
          let dist = Math.hypot(dx2, dy2);
          if (dist > 0) {
            e.x += (dx2 / dist) * enemySpeed * 0.8;
            e.y += (dy2 / dist) * enemySpeed * 0.8;
          }
        } else if (e.type === 'runner') {
          e.x += enemySpeed * (e.state === 0 ? 1 : -1);
          if (e.x > W-20 || e.x < 20) e.state = 1 - e.state;
        } else if (e.type === 'jumper') {
          e.jumpTimer++;
          if (e.jumpTimer % 40 === 0) e.y -= 20;
          e.y += 0.3;
          if (e.y > 510) e.y = 510;
          e.x += Math.sin(e.jumpTimer/30) * 0.8;
        } else if (e.type === 'spinner') {
          e.angle += 0.03;
          let cx = 200, cy = 450;
          e.x = cx + Math.cos(e.angle) * 60;
          e.y = cy + Math.sin(e.angle) * 40;
        }

        if (rectCollide(player, e)) {
          if (player.shieldTimer > 0) {
            playShieldHitSound();
            spawnParticles(e.x+7, e.y+7, '#00C853', 12);
            e.hp = 0;
          } else {
            gameOver();
            return;
          }
        }
      }
      enemies = enemies.filter(e => e.hp > 0);

      if (player.shieldTimer > 0) {
        player.shieldTimer--;
        if (player.shieldTimer <= 0) player.shield = false;
      }
      if (player.doubleJumpTimer > 0) player.doubleJumpTimer--;

      if (frame % 22 === 0) spawnCoins();
      enemySpawnTimer++;
      if (enemySpawnTimer > Math.max(15, 55 - difficulty * 2.5)) {
        spawnEnemy();
        enemySpawnTimer = 0;
      }
      powerupSpawnTimer++;
      if (powerupSpawnTimer > 110 + rand(0, 70)) {
        spawnPowerup();
        powerupSpawnTimer = 0;
      }

      camera.x = player.x - W/2;
      camera.y = player.y - H/2 + 70;
      camera.x = Math.max(0, camera.x);
      camera.y = Math.min(0, Math.max(camera.y, -100));

      let playerTileX = Math.floor(player.x / 30);
      for (let i = -5; i < 30; i++) {
        let tx = (playerTileX + i) * 30;
        if (!tiles.some(t => Math.abs(t.x - tx) < 1)) {
          tiles.push({ x: tx, y: 510, w: 30, h: 15 });
        }
      }
      tiles = tiles.filter(t => Math.abs(t.x - player.x) < 500);
      for (let tile of tiles) {
        if (tile.x < player.x - 160 && !holes.some(h => Math.abs(h.x - tile.x) < 10)) {
          holes.push({ x: tile.x, y: 510, w: 30, h: 15 });
        }
      }
      tiles = tiles.filter(t => t.x >= player.x - 160);

      coinsList = coinsList.filter(c => c.x > player.x - 280);
      enemies = enemies.filter(e => e.x > player.x - 280);
      powerups = powerups.filter(p => p.x > player.x - 280);

      scoreSpan.textContent = Math.floor(score);
      coinSpan.textContent = coins;
      timeSpan.textContent = Math.floor(survivalTime);

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('onemorestep_best', bestScore);
        bestSpan.textContent = bestScore;
      }
      localStorage.setItem('onemorestep_totalCoins', totalCoins);
    }

    // ============================================================
    // DRAW - Adjusted for 9:12
    // ============================================================
    function drawBackground() {
      let gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, '#0B0D1A');
      gradient.addColorStop(0.3, '#0B0D1A');
      gradient.addColorStop(0.6, '#14103A');
      gradient.addColorStop(1, '#1A1446');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      const mountOffset = (bgOffset * 0.1) % 800;
      for (let i = -1; i < 3; i++) {
        let baseX = i * 800 + mountOffset;
        ctx.beginPath();
        ctx.moveTo(baseX - 100, 530);
        ctx.lineTo(baseX + 50, 340);
        ctx.lineTo(baseX + 150, 410);
        ctx.lineTo(baseX + 280, 300);
        ctx.lineTo(baseX + 400, 380);
        ctx.lineTo(baseX + 500, 320);
        ctx.lineTo(baseX + 600, 360);
        ctx.lineTo(baseX + 700, 450);
        ctx.lineTo(baseX + 800, 530);
        ctx.fillStyle = 'rgba(80, 60, 180, 0.08)';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(baseX - 50, 530);
        ctx.lineTo(baseX + 80, 390);
        ctx.lineTo(baseX + 200, 430);
        ctx.lineTo(baseX + 350, 360);
        ctx.lineTo(baseX + 500, 410);
        ctx.lineTo(baseX + 650, 370);
        ctx.lineTo(baseX + 800, 530);
        ctx.fillStyle = 'rgba(100, 80, 200, 0.06)';
        ctx.fill();
      }
      ctx.restore();

      ctx.save();
      const gridOffset = (bgOffset * 0.3) % 80;
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = -80; i < W + 80; i += 80) {
        let x = i + gridOffset;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let i = 0; i < H; i += 80) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(W, i);
        ctx.stroke();
      }
      ctx.restore();

      for (let p of bgParticles) {
        p.x -= p.speed * 0.5;
        if (p.x < -10) p.x = W + 10;
        p.y += Math.sin(p.x * 0.01) * 0.02;
        ctx.fillStyle = `rgba(200, 200, 255, ${p.alpha * 0.5})`;
        ctx.shadowColor = 'rgba(200, 200, 255, 0.1)';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();

      ctx.save();
      if (screenShake > 0) {
        ctx.translate(rand(-4,4), rand(-4,4));
        screenShake--;
      }
      ctx.translate(-camera.x, -camera.y);

      for (let t of tiles) {
        ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
        ctx.shadowColor = 'rgba(0, 229, 255, 0.3)';
        ctx.shadowBlur = 8;
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(t.x, t.y, t.w, t.h);
      }

      for (let h of holes) {
        ctx.fillStyle = '#0B0D1A';
        ctx.fillRect(h.x, h.y, h.w, h.h);
        ctx.fillStyle = 'rgba(255, 59, 59, 0.3)';
        ctx.fillRect(h.x, h.y, h.w, 3);
      }

      for (let c of coinsList) {
        c.bob += 0.06;
        let yOff = Math.sin(c.bob) * 2;
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(c.x+6, c.y+6+yOff, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FFC107';
        ctx.font = '9px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★', c.x+6, c.y+6+yOff+1);
      }

      for (let p of powerups) {
        let color = p.type === 'speed' ? '#FF6600' :
                    p.type === 'slow' ? '#FFFFFF' :
                    p.type === 'magnet' ? '#9C27B0' : '#00C853';
        ctx.shadowColor = color;
        ctx.shadowBlur = 22;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x+7, p.y+7, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#0B0D1A';
        ctx.font = 'bold 6px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type.slice(0,3), p.x+7, p.y+7);
      }

      for (let e of enemies) {
        ctx.shadowColor = '#FF3B3B';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#FF3B3B';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#FF3B3B';
        ctx.lineWidth = 1;
        ctx.strokeRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#0B0D1A';
        ctx.fillRect(e.x+3, e.y+3, 3, 3);
        ctx.fillRect(e.x+9, e.y+3, 3, 3);
      }

      let showPlayer = true;
      let shieldBlink = false;
      if (player.shieldTimer > 0 && player.shieldTimer < 120) {
        shieldBlink = Math.floor(player.shieldTimer / 6) % 2 === 0;
        if (shieldBlink) showPlayer = false;
      }

      if (showPlayer) {
        ctx.shadowColor = '#00E5FF';
        ctx.shadowBlur = 22;
        ctx.fillStyle = player.shieldTimer > 0 ? '#00C853' : '#00E5FF';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#00E5FF';
        ctx.lineWidth = 2;
        ctx.strokeRect(player.x, player.y, player.w, player.h);

        if (player.doubleJumpTimer > 0) {
          ctx.strokeStyle = '#00E5FF';
          ctx.lineWidth = 2;
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#00E5FF';
          ctx.strokeRect(player.x-3, player.y-3, player.w+6, player.h+6);
          ctx.shadowBlur = 0;
        }

        ctx.fillStyle = '#0B0D1A';
        ctx.fillRect(player.x+4, player.y+4, 3, 3);
        ctx.fillRect(player.x+10, player.y+4, 3, 3);
      }

      for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life--;
        ctx.globalAlpha = p.life/40;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      for (let f of floatingTexts) {
        f.y -= 0.8;
        f.life--;
        ctx.fillStyle = f.color;
        const fontSize = f.size || 13;
        ctx.font = `bold ${fontSize}px monospace`;
        ctx.shadowColor = f.color;
        ctx.shadowBlur = 12;
        ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x + 20, f.y);
      }
      ctx.shadowBlur = 0;

      ctx.restore();

      if (player.shieldTimer > 0 && player.shieldTimer < 120) {
        ctx.fillStyle = '#FF4444';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'right';
        ctx.shadowColor = '#FF4444';
        ctx.shadowBlur = 12;
        const blink = Math.floor(player.shieldTimer / 6) % 2 === 0;
        if (blink) ctx.fillText('⚠️ SHIELD LOW!', W - 10, 28);
        ctx.shadowBlur = 0;
      }

      if (player.shieldTimer > 0) {
        ctx.fillStyle = '#00C853';
        ctx.font = '8px monospace';
        ctx.textAlign = 'left';
        ctx.shadowColor = '#00C853';
        ctx.shadowBlur = 6;
        ctx.fillText('🛡️ ' + Math.ceil(player.shieldTimer/60) + 's', 6, 6 + 10*4);
        ctx.shadowBlur = 0;
      }

      let statusY = 5;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '8px monospace';
      ctx.textAlign = 'left';
      if (player.speedBoostTimer > 0) {
        ctx.fillStyle = '#FF6600';
        ctx.fillText('⚡ ' + Math.ceil(player.speedBoostTimer/60) + 's', 6, statusY);
        statusY += 10;
      }
      if (player.slowEnemyTimer > 0) {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('🐌 ' + Math.ceil(player.slowEnemyTimer/60) + 's', 6, statusY);
        statusY += 10;
      }
      if (player.magnetTimer > 0) {
        ctx.fillStyle = '#9C27B0';
        ctx.fillText('🧲 ' + Math.ceil(player.magnetTimer/60) + 's', 6, statusY);
        statusY += 10;
      }

      ctx.fillStyle = 'rgba(255, 100, 100, 0.25)';
      ctx.font = '8px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('Lv.' + Math.floor(difficulty), W - 10, 18);

      if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(11, 13, 26, 0.85)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#FF3B3B';
        ctx.font = 'bold 30px monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#FF3B3B';
        ctx.shadowBlur = 25;
        ctx.fillText('💀 GAME OVER', W/2, 220);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#00E5FF';
        ctx.font = '18px monospace';
        ctx.fillText('Score: '+Math.floor(score), W/2, 275);
        ctx.fillText('Coins: '+coins, W/2, 310);
        if (score >= bestScore && score > 0) {
          ctx.fillStyle = '#FFD700';
          ctx.shadowColor = '#FFD700';
          ctx.shadowBlur = 18;
          ctx.fillText('🏆 NEW BEST!', W/2, 355);
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = '#00E5FF';
        ctx.font = '14px monospace';
        ctx.fillText('Tap / Press R to restart', W/2, 410);
      }

      if (gameState === 'paused') {
        ctx.fillStyle = 'rgba(11, 13, 26, 0.8)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#00E5FF';
        ctx.font = 'bold 28px monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#00E5FF';
        ctx.shadowBlur = 25;
        ctx.fillText('⏸ PAUSED', W/2, 300);
        ctx.shadowBlur = 0;
      }
    }

    // ============================================================
    // GAME LOOP
    // ============================================================
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // ============================================================
    // START GAME
    // ============================================================
    function startGame() {
      initAudio();
      startMenu.classList.add('hidden');
      initGame();
    }

    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });

    // ============================================================
    // CONTROLS
    // ============================================================
    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (gameState === 'menu') {
        if (key === 'Enter' || key === ' ') { e.preventDefault(); startGame(); }
        return;
      }
      if (key === 'w' || key === 'W' || key === 'ArrowUp') keys.w = true;
      if (key === 's' || key === 'S' || key === 'ArrowDown') keys.s = true;
      if (key === 'r' || key === 'R') { if (gameState === 'gameover') initGame(); }
      if (key === 'Escape') {
        if (gameState === 'playing') { gameState = 'paused'; pauseBackgroundMusic(); }
        else if (gameState === 'paused') { gameState = 'playing'; resumeBackgroundMusic(); }
      }
      e.preventDefault();
    });
    document.addEventListener('keyup', (e) => {
      const key = e.key;
      if (key === 'w' || key === 'W' || key === 'ArrowUp') keys.w = false;
      if (key === 's' || key === 'S' || key === 'ArrowDown') keys.s = false;
      e.preventDefault();
    });

    // TOUCH ANYWHERE TO JUMP
    // Every tap/click refreshes the survival timer. Stop tapping for 1 second and the game ends.
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'menu') { startGame(); return; }
      if (gameState === 'gameover') { initGame(); return; }
      if (gameState === 'playing') {
        lastTapTime = performance.now();
        touchJump = true;
        canvas.style.borderColor = '#00E5FF88';
        setTimeout(() => { canvas.style.borderColor = '#00f0ff55'; }, 150);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      touchJump = false;
    }, { passive: false });

    canvas.addEventListener('touchcancel', (e) => {
      touchJump = false;
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      if (gameState === 'menu') { startGame(); return; }
      if (gameState === 'gameover') { initGame(); return; }
      if (gameState === 'playing') {
        lastTapTime = performance.now();
        touchJump = true;
        canvas.style.borderColor = '#00E5FF88';
        setTimeout(() => { canvas.style.borderColor = '#00f0ff55'; }, 150);
      }
    });

    canvas.addEventListener('mouseup', () => { touchJump = false; });
    canvas.addEventListener('mouseleave', () => { touchJump = false; });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      if (gameState === 'playing') { gameState = 'paused'; pauseBackgroundMusic(); }
      else if (gameState === 'paused') { gameState = 'playing'; resumeBackgroundMusic(); }
    });

    // ============================================================
    // START
    // ============================================================
    bestSpan.textContent = bestScore;
    initGame();
    gameState = 'menu';
    startMenu.classList.add('intro-hidden');

    // Developer intro: photo + "Developer" + AKSHAYADHARSHINI stay visible for 25 seconds.
    // Then the intro fades out and the normal ONE MORE STEP game title + PLAY button appear.
    const developerIntro = document.getElementById('developerIntro');
    setTimeout(() => {
      developerIntro.classList.add('fade-out');
      startMenu.classList.remove('intro-hidden');
    }, 25000);

    loop();

    console.log('🎮 One More Step - 9:12 Aspect Ratio');
    console.log('Press PLAY to start');
    console.log('🔊 Louder sound effects & background music');
    console.log('⚡ Difficulty increases over time!');
  })();
</script>
</body>
</html>
